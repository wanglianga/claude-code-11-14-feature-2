spring:
  application:
    name: flight-regularity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ccdev}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 统计口径与运行参数（口径同时在 /api/caliber 与 README 中固化说明）
app:
  # 放行正常判定容差：实际起飞 <= 当时生效计划起飞 + 该分钟数 记为正常
  release-tolerance-minutes: 20
  # 迟到窗口：event_time 早于 (接收时刻 - 窗口) 的事件标记为迟到并走补录来源
  late-window-hours: 6
  # 日报版本间逐航班比对阈值：延误分钟差超过该值或正常性翻转记为差异
  diff-threshold-minutes: 5
  # 测试账号（仅本隔离开发/验证环境使用，非生产配置）
  security:
    manager-password: ${APP_MANAGER_PASSWORD:manager123}
    viewer-password: ${APP_VIEWER_PASSWORD:viewer123}
